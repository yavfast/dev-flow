shipped_card: 1
name: phase-start
version: 3
contract:
  name: phase-start
  purpose: Print the project facts of phase start checklist items 1, 2, 4, 6, 7 and the fields of the start record in one run
  kind: operation
  range_of_use:
    - {case: continuing-task, description: "a task id is given: its dashboard row and task file facts; the upstream look is skipped"}
    - {case: new-task, description: "no task id: the upstream look fetches the branch's upstream and reports incoming, overlap and unpushed"}
    - {case: no-upstream, description: "a git directory whose current branch, born or unborn, has no upstream: the look reports none"}
    - {case: detached-head, description: "a git directory with no branch checked out: the look reports none"}
    - {case: linked-worktree, description: "the git directory is a linked worktree's .git file: facts as for a directory; the fetch writes in the main repository's git directory"}
    - {case: fetch-failed, description: "the upstream fetch fails: the look reports the failure and the last fetched state"}
    - {case: relevant-set, description: "touched paths given: rules, skills and tools matched by path globs and by phase"}
    - {case: phase-only, description: "no paths: rules, skills and tools matched by the phase and the always-on selectors"}
    - {case: no-catalogue, description: "a project with no .dev_flow/ and no git: every catalogue fact is none"}
    - {case: unparsable-index, description: "an index that does not parse as YAML: its fact is not established, the others print"}
    - {case: profile-unprotected, description: "a profile store git does not ignore: reported, values never printed"}
    - {case: seeds, description: "the skill's shipped cards against the project's router"}
    - {case: submodule, description: "the git directory is a submodule's .git file: facts as for a directory; the fetch writes in the submodule's git directory under the superproject's modules/"}
  not_for:
    - "choosing the role style"
    - "reading the phase file"
    - "deciding trust in a tool"
    - "judging a gate"
    - "writing the task file, the dashboard or the catalog"
  applies_to: {paths: [], phases: []}
  limits:
    - "facts as of the run; a file changed after it is not seen"
    - "reads only the files the phase start checklist names; prints no profile value, so the chat language a profile records is the agent's to read"
    - "skills with no applies_to on their entry or domain are matched by topic, which is the agent's judgement: they are listed with their topics, never chosen"
    - "the machine's and the repository's git configuration apply — excludes, include files, core.sshCommand and ssh's own configuration (the ProxyCommand, ProxyJump, Match exec and KnownHostsCommand programs it names run), credential helpers (credential.interactive=false asks them for no window; a helper may ignore it), a remote helper for a `<transport>::` URL or remote.<name>.vcs, core.gitProxy, core.alternateRefsCommand, proxies, redirects, url.<base>.insteadOf, the http.* files; the caller's environment reaches git only through the allow-list in behavior, so a CA given only by the caller's GIT_SSL_CAINFO is not seen"
    - "an upstream input is tested for local as written: a url.<base>.insteadOf that rewrites it into a remote URL is not seen by that test, so its fetch keeps the local --upload-pack string"
    - "a local upstream that is itself a partial clone may fetch lazily from its own promisor remote during upload-pack with git older than 2.45.1"
    - "phase- or condition-scoped style profiles are named, never resolved: which of them applies is the agent's to decide"
    - "the upstream fetch needs the network and the remote's credentials without a prompt; a failed fetch reports the last fetched state"
    - "with no upstream input the fetch takes only the upstream branch, into the ref @{u} names; an upstream whose ref lies outside refs/remotes/ is not fetched and counts as a failed fetch"
    - "no sample pins a reftable repository, git older than 2.29 or a git --version with no version, the 30-second fetch stop, a failed ls-remote --get-url (whatever breaks it breaks the upstream lookup first), outgoing commits whose committer dates disagree with their order, a missing YAML parser or git program, an upstream input given as a URL, the fetch without the upstream input (every sample gives one), a signed commit under log.showSignature, a configured diff.orderFile, an alternates object store, a partial clone with git older than 2.45.1, an incoming rename, a remote reached over ssh or http(s), a credential, ssh or remote helper, a promisor remote the server advertises, a caller's runtime variable, a path holding a line feed, or a usage error (an empty --phase= among them; a sample's exit follows the exit-code contract): no sample builds them, behavior pins them"
    - "a local upstream's fetch runs env through sh (uploadpack.packObjectsHook=env): both must be on PATH"
    - "code the runtime's own installation runs at its start-up (a .pth file or a sitecustomize module in the interpreter's own site-packages) belongs to the installation environment.requires names"
    - "the upstream value without paths has one element per incoming commit: a branch far behind its upstream prints one long line"
    - "in phase `tool` only always-on and path selectors match: the Selector's phase set (references/knowledge-scaling.md) has no `tool`"
    - "the start line is one value, not split by the list grammar (its parts hold `; ` and ` · `); a copied value that begins with `? ` reads like a fact not established"
    - "special files are read as files: a FIFO under .dev_flow/ blocks the run, and a symbolic link is followed — the outside rule tests paths as written, so a link under .dev_flow/skills/ to a file elsewhere is read"
    - "an upstream configured whose remote-tracking ref is missing (pruned, or never fetched) answers `? git rev-parse failed: …`, and no fetch restores the ref"
    - "a locale whose encoding is not UTF-8 is outside the range of use: a path or an argument outside ASCII may fail or print altered (the samples run under C.UTF-8)"
    - "a relative root or skill whose name starts with `--` reads as an option: give it as `./<name>` or as an absolute path"
  inputs:
    - {name: root, type: path, required: true, description: "project root"}
    - {name: skill, type: path, required: true, description: "dev-flow skill root; holds SKILL.md"}
    - {name: phase, type: enum, required: true, values: [onboard, research, concept, spec, plan, implement, test, review, verify, propagate, fix, rule, skill, tool, ask, todo, do, subtask, status, audit, adopt], description: "the starting phase"}
    - {name: key, type: string, required: false, description: "step key of the phase, e.g. analysis for fix; printed in the start fields only"}
    - {name: paths, type: string, required: false, description: "project-relative paths the phase touches, comma-separated (a string, never resolved against the caller's directory); a directory ends with /"}
    - {name: task, type: string, required: false, description: "id of the continued task, ^task_[A-Za-z0-9_-]+$ (another value prints task: ? not a task id); absent = a new task"}
    - {name: git_dir, type: path, required: false, description: "git directory, or a linked worktree's or submodule's .git file; absent = <root>/.git"}
    - {name: upstream, type: path, required: false, description: "a repository to fetch from in place of the upstream remote's URL (samples)"}
  invocation: ['{root}', '{skill}', '--phase={phase}', '--key={key}', '--paths={paths}', '--task={task}', '--git-dir={git_dir}', '--upstream={upstream}']
  output:
    format: lines
    shape: "one fact per line, `<key>: <value>`, keys tasks, task, upstream, rules, skills, tools, budget, styles, profile, docs, seeds, start in this order"
    size_class: small
  behavior: >
    Exit 2 with `cannot-decide: <reason>` on stderr and nothing on stdout when, checked in this order: root is not
    a directory (`root is not a directory`); skill holds no SKILL.md (`skill root holds no SKILL.md`); phase is not
    one of the enum values (`unknown phase <phase>`); no YAML parser is available to the realization (`no YAML
    parser`). A usage error (an unknown, value-less or repeated option; not exactly two positional arguments; no
    --phase, or --phase= with an empty value) prints a usage line on stderr and exits 3. Otherwise print the twelve lines below, in order, and exit
    0; an error outside the facts exits 3 with `phase-start: failure: <error type>: <message>` on stderr. The
    realization's runtime runs isolated from the caller's: it reads none of its own variables from the caller's
    environment (module path, home, compiled-file cache, warnings, inspection, I/O encoding, user base among
    them) but the locale's (LC_ALL, LC_CTYPE, LANG), loads no code from a user site, from the directory the
    realization lies in or from the working directory, and writes no compiled module file, from its start-up
    on — for python3 the invocation prefix is `[python3, -I, -B, <realization>]` (isolated mode, no bytecode);
    another runtime takes its own equivalent, and a runtime with none cannot realize the card.

    Grammar of every line: `<key>: <value>`; a list value joins its elements with `; `, fields inside an element
    with ` · `; `—` means none; `? <reason>` means the fact was not established — the agent answers that item by
    hand; a list value holding `? …` elements among its elements is an established fact. A failure to read or parse one source never stops the others; an unexpected error inside one fact prints
    `? <error type>: <message>` as that fact. A value taken from a file, from git's output or from an input (a
    cell, a heading, a status, a Next text, a name, a summary, a stamp, a path, a stderr line, the task and key
    inputs) is copied as found, never interpreted, except that each line break becomes a space, every `;` is
    written `,` and every `·` is written `-`, so a copied value never splits an element or a field — a value
    ending in `;` or ` ·` would otherwise join the next separator; a value copied into a `cannot-decide:` reason or
    a usage line follows the same rule. Paths below are relative to root. A file is read as UTF-8, a leading byte-order mark
    dropped and an invalid byte replaced; a line ends at \r\n, \r or \n. YAML the parser rejects — a value it
    cannot construct, such as the date 2026-02-30, included — is not YAML (unparsable) wherever a fact below says
    so; front matter the parser rejects is unparsable front matter. A value read from YAML prints as the scalar's
    text in the file — `on`, `1.10`, `0x1F`, `2026-11-20 14:30:00` and an explicitly tagged `!!binary aGk=` stay so —
    never as the type the parser resolves it to; a null (`~`, `null`, an empty value) reads as absent — a null field
    prints as a missing one, a null list element is left out. In Markdown, a fenced code block runs from a
    line whose text after at most three spaces starts with three or more backticks or tildes to the next line
    that starts so with at least as many of the same character, else to the end of the file; its lines, the
    fence lines included, are never a heading, a table row, a `>` field line, a bullet or a Next line of any fact. An optional input given empty counts as
    omitted. paths is split at `,`, each element trimmed, empty elements dropped, never normalized.

    GIT. The git directory is git_dir when given, else <root>/.git; it is used only when that path exists — a
    directory, or the `.git` file of a linked worktree or submodule, which git follows — and the tool never
    searches parent directories. No git directory → "no git". Every git command runs from root as
    `git -c core.hooksPath=<the null device> -c core.fsmonitor=false --git-dir=<git dir> --work-tree=<root> …`,
    in a child environment of only: the caller's `PATH`, `HOME` and `XDG_CONFIG_HOME`, those that are set (the
    fetch adds more, below); `LC_ALL=C`, `GIT_TERMINAL_PROMPT=0`, `GIT_ASKPASS` empty, `GIT_NO_LAZY_FETCH=1`,
    `GIT_TRACE2=0`,
    `GIT_TRACE2_EVENT=0`, `GIT_TRACE2_PERF=0`; and `hook.<name>.enabled=false` for each name the configuration
    gives a `hook.<name>.*` key (the names from `config -z --name-only --get-regexp ^hook\.`, run first under
    the same rules; a name is the text between the first and the last dot of its key, `=` and dots included),
    passed as `GIT_CONFIG_COUNT`, `GIT_CONFIG_KEY_<n>`, `GIT_CONFIG_VALUE_<n>` — never as `-c`,
    which splits a name holding `=` at its first `=`. The same variables carry `log.showSignature=false`,
    `diff.orderFile=<the null device>`, `maintenance.auto=false` and `gc.auto=0`, so no `log` starts a signature
    verifier, no order file is read and no command leaves a maintenance run behind. No
    other caller variable reaches git — `GIT_*` and
    `SSH_ASKPASS` included: no hook of any kind runs, no signature verifier or fsmonitor starts, no trace is written, no prompt program
    runs and git's messages are not translated, while the machine's and the repository's git configuration apply
    (`HOME` and `XDG_CONFIG_HOME` are read by git). No git command of the tool runs inside a submodule. A partial clone — `config --get extensions.partialClone` prints a value, or `config --type=bool --get-regexp ^remote\..*\.promisor$` prints a `true` — with a git older than 2.45.1, the first release whose every git command honours GIT_NO_LAZY_FETCH, or a `git --version` with no `<major>.<minor>.<patch>`: the fetch, rev-list, diff, log and check-ignore do not run, and what they serve reads `? git <the version, else the output's first line> may fetch lazily (2.45.1 or later)` — the upstream value of a new task, the profile's ignored part. A list of paths from git is read NUL-separated (`-z`), so a path outside ASCII compares and
    prints as written. A single path git prints (`rev-parse --git-common-dir`, `--git-path …`) comes from a call that
    prints only that path, minus one trailing line feed, so a path holding a line feed stays whole. A
    git command a fact needs that exits non-zero → `? git <subcommand> failed: <its first non-empty stderr line,
    else exit <code>>` as that fact — except a `config` lookup's exit 1, which means no such key.

    tasks — the rows of the table under `## Active Tasks` in .dev_flow/active_context.md, in file order, each
    `<task id> · <phase> · <status> · <contributors> · <updated>`: the task id is the link text of the first
    cell (`[task_X](…)` → `task_X`; a cell with no link → the cell trimmed), the other fields are cells 2–5
    trimmed, a missing or empty cell `—`. File or section absent → `—`.

    task — no task input → `—`. A task input that does not match `^task_[A-Za-z0-9_-]+$` as a whole (one holding a
    line feed does not) → `? not a task id <value>`, and no file is read for it. Else read .dev_flow/tasks/<task>.md; missing → `? no task file
    <task>.md`. Print `<task> · status <s> · phase <p> · stage <g> · style <y> · autonomy <a> · next <n>`: s from
    the header line `> **Status:** …`, a from `> **Autonomy:** …`, p, g, y from the rows `**Pipeline phase**`,
    `**Stage**`, `**Role style**` of the `## Current Work Item` table — each the first backtick-quoted token of the
    value, else the value trimmed, `—` when the line or row is missing or its value is empty; n is the text after
    `**Next:** ` on the
    first Next line of the last `### Subtask:` block whose `> Author:` line does not carry `Status: \`done\`` (a
    block ends at the next heading of level 1–3; a block with no Author line counts as not done), trimmed; no such
    block, no Next line in it or an empty text → `—`, and no earlier block is read.

    upstream — task input given, valid or not → `skipped (continuing task)`. No git → `none (not a git
    repository)`. Current branch from `symbolic-ref -q HEAD`, its leading `refs/heads/` removed (`--short` would
    print `heads/<branch>` when a tag has the branch's name); none → `none (detached HEAD)`. No
    `branch.<branch>.merge` key (its `config` lookup exits 1), the branch born or unborn → `none (no upstream)`;
    else the upstream from `rev-parse --abbrev-ref --symbolic-full-name @{u}`, a failure there by the rule above
    (an upstream whose remote-tracking ref is missing among them). <remote> is the value of
    `config branch.<branch>.remote`. Fetch: git older than 2.29 (the first `<major>.<minor>` of `git --version`)
    → no fetch, and the fetch counts as failed with the reason `git older than 2.29`; an output with no
    `<major>.<minor>` → the fetch runs. Else run
    `-c fetch.writeCommitGraph=false -c fetch.bundleURI= -c credential.interactive=false -c http.saveCookies=false
    fetch -q --no-tags --no-prune --no-prune-tags
    --no-recurse-submodules --no-write-fetch-head --no-auto-maintenance --refmap=` (no configured refspec maps
    a fetched ref), then, when the repository is local,
    `--upload-pack=git -c uploadpack.packObjectsHook=env upload-pack` (so a configured pack-objects hook does not
    run), then `--end-of-options`, then `<upstream> +refs/heads/*:refs/remotes/<remote>/*` when the upstream input
    is given, else `<remote> +<merge>:<tracking>` — the remote's name, never the URL `ls-remote --get-url`
    prints (that URL serves the local test only), so git applies the remote's settings and url.<base>.insteadOf
    once — <merge> the first value `config --get-all branch.<branch>.merge` prints (the one @{u} follows),
    <tracking> what `rev-parse --symbolic-full-name @{u}` prints; a <tracking> outside `refs/remotes/` → no
    fetch, and the fetch counts as failed with the reason `upstream ref outside refs/remotes/: <tracking>`;
    the fetch's environment adds `GIT_COMMITTER_NAME=phase-start` and `GIT_COMMITTER_EMAIL=phase-start@localhost` (the
    identity of the remote-tracking reflog entry, so git builds none from the system: no account, mail-name or
    host-name lookup), `GIT_SSH_COMMAND=<ssh> -o BatchMode=yes -o UpdateHostKeys=no -o ControlMaster=no
    -o ClearAllForwardings=yes` (no prompt, no host key rewritten, no master or forwarding left open), <ssh> being
    the value of `config core.sshCommand`, else `ssh`, and passes on, when the caller has them set, `SSH_AUTH_SOCK`
    (ssh), `http_proxy`, `https_proxy`, `all_proxy`, `no_proxy` and their upper-case forms, and
    `DBUS_SESSION_BUS_ADDRESS`, `XDG_RUNTIME_DIR`, `XDG_CACHE_HOME`, `SSL_CERT_FILE`, `SSL_CERT_DIR` (credential
    helpers and a custom CA). The repository — the upstream input, else the URL
    `ls-remote --get-url --end-of-options <remote>` prints (it reads only the configuration and runs in the general
    environment above, without the fetch's additions; when it fails, no fetch runs and the fetch counts as failed
    with the reason `ls-remote --get-url failed: <its first non-empty stderr line, else exit <code>>`) — is local
    when it is a `file://` URL or a path: no
    `<scheme>://`, and no `:` or a `/` before its first `:` (`host:path` is a remote). The fetch therefore writes
    only in the common git directory (`rev-parse
    --git-common-dir`: the git directory — for a submodule's .git file the submodule's git directory under the
    superproject's `modules/` — or the main repository's for a linked worktree): the remote-tracking refs
    (under `reftable/` in a reftable repository), their reflog when the repository keeps one, and the fetched
    objects — no tag, no FETCH_HEAD, no pruned ref, no packed-refs rewrite, no submodule, no commit-graph, no
    maintenance — except a remote helper's private refs and marks, and the common git directory's config when
    promisor.acceptFromServerUrl, or promisor.acceptFromServer with promisor.storeFields, accepts a promisor remote
    the server advertises. Its transport is the configuration's — ssh with its own configuration, libcurl for
    http(s), the configured credential helpers (asked for no window by credential.interactive=false), a remote
    helper `git-remote-<transport>` for a `<transport>::` URL or remote.<remote>.vcs, a proxy, url.<base>.insteadOf;
    with an alternates object store the fetch also starts `git for-each-ref` in each alternate's repository, or the
    command core.alternateRefsCommand names — and effects names what they read, write and reach. A local
    upstream's upload-pack runs without the GIT_CONFIG_ variables, which git clears for it; its own `-c` is the
    `--upload-pack` string's. The fetch gets 30 seconds; past
    that its process group gets SIGTERM, then SIGKILL as soon as the fetch has exited or 5 seconds have passed,
    whichever comes first, and it counts as failed with the reason
    `timeout after 30 s`; any other failure's reason is the fetch's first non-empty stderr line, else `exit
    <code>`. Then N = `rev-list --count HEAD..@{u}`, the incoming files = `diff --no-renames -z --name-only HEAD...@{u}` in
    git's order, M = `rev-list --count @{u}..HEAD`. With paths given, the task's files are the incoming files equal
    to a path or lying under a path ending in `/`; the value is
    `<N> incoming (<K> touch the task: <files joined by ", " or —>) · <M> unpushed`; without paths it is
    `<N> incoming (task files unknown: <commits joined by ", " or —>) · <M> unpushed`, one commit element per
    incoming commit, newest first, `<short hash> <file count> files`, the files from `log --no-mailmap --no-renames
    --format=%x00%h -z --name-only --diff-merges=first-parent HEAD..@{u}` (a merge counted against its first parent;
    each commit starts with a NUL, so a commit without files is never taken for a file). When M > 0
    append ` (oldest <age>)`, the age of the oldest outgoing commit — the smallest committer date among the
    outgoing commits (`log --no-mailmap --format=%ct @{u}..HEAD`) — as `<d>d`, `<h>h` or `<m>m`, rounded down; a date in the future → `0m`. Every `log`
    runs with `--no-mailmap` and its own `--format`, and the `diff` and that `log` with `--no-renames`, so no
    .mailmap is read, no configured format.pretty applies (a `%G?` in one would start a signature verifier), and
    no attribute file or file content is read for rename detection — a renamed file lists both names. The `diff` and that `log` also take `--ignore-submodules=none`, so no
    submodule setting is read (the work tree's .gitmodules among them) and a changed gitlink lists as its path;
    every `rev-list`, `diff` and `log` ends its revisions with `--`, so git never looks for one as a path in the
    work tree. A failed
    fetch prefixes the value with
    `? fetch failed: <reason> — last fetched state: `; when a later git command of the look fails too, the prefix
    stays and the rest of the value is that command's `? git <subcommand> failed: …` value.

    rules — .dev_flow/rules/_index.yaml absent → `—`; not YAML, or YAML that is not a mapping → `? unparsable
    .dev_flow/rules/_index.yaml`. The relevant set of Knowledge Scaling's activation protocol: a category selector
    is its `applies_to`, absent or null = always-on; a rule entry with `moved_to` is skipped; a rule's selector is
    its own `applies_to`, else its category's. A selector matches when it is always-on, or the phase is in its
    `phases`, or one of its `paths` globs covers one of the input paths (`**` = zero or more segments, `*`, `?` and
    `[…]` inside one segment, a class read as fnmatch reads it — `!` right after `[` negates, a `]` right after `[`
    or `[!` is a member, a `-` first or last is a member, a `[` with no closing `]` is literal; a path ending in `/` names a directory and is covered by a glob whose text before
    its first `*`, `?` or `[` starts with that path, or is a prefix of it ending at a `/`, or is empty while the
    glob holds a `/` or `**`); a selector that is not a mapping matches nothing. Each matched rule:
    `<name> · <severity> · <summary> · <category file>#<name>`, ordered must, should, prefer — severities compared
    exactly, case-sensitive, so `Must` is another severity — any other severity after prefer, then index order. No match → `—`.

    skills — .dev_flow/skills/_index.yaml absent → `—`; not YAML or not a mapping → `? unparsable
    .dev_flow/skills/_index.yaml`. For each domain (`path`; one without a trailing `/` gets one) read
    .dev_flow/skills/<path>_index.yaml (missing, unreadable — a directory among them —, not YAML or not a mapping →
    that domain's element is
    `? <path>_index.yaml unreadable`) and each skill entry. A domain path, or an entry `file`, that is absolute by
    the running platform's rule, starts with `/` or `\`, or holds a `..` segment between `/` — tested as written,
    before any joining → `? <path> outside .dev_flow/skills/` (for an entry <path> is the domain path joined with
    the file; a `file` absolute or starting with `/` or `\` is printed as written), and nothing under it is read; any other path, `c:ops/`
    on a POSIX platform among them, lies inside. An entry's selector is its own `applies_to`, else its domain's (the
    domain index's own `applies_to`, else the `domains` entry's), else none. An entry with a selector is printed
    only when the selector matches (as for rules): `<path><file> · <skill> · <freshness>`. An entry with no
    selector is printed with its topics, for the agent's topic match: `<path><file> · <skill> · <freshness> ·
    topics <topics joined by ", ">`. An entry outside the directory prints its `? … outside` element in the place
    its element would take. freshness comes from the YAML front matter of the skill file (the lines between a
    first line `---` and the next `---` or `...`): `freshness.state` and `freshness.written_against` →
    `<state> <written_against>`, either one missing → `—` for it; no or unparsable front matter, or a freshness
    with neither field → `no stamp`; file missing, unreadable or not a name a file can have (a NUL in it) → `missing`. Order: selector-matched entries, then
    topic entries, each in index order, then the elements of unreadable domains and of domains outside the
    directory, in index order. None → `—`.

    tools — .dev_flow/tools/_index.yaml absent → `—`; not YAML or not a mapping → `? unparsable
    .dev_flow/tools/_index.yaml`. Each entry of `tools` whose `state` is not `retired` and whose `applies_to`
    matches (absent or null = always-on): `<name> · <when_to_use> · <run joined by spaces> · <state, else the
    regime, else —>`, in index order. None → `—`.

    budget — n = the number of rule elements, selector-matched skill elements (a `?` element not counted) and tool
    elements printed above. The budget is the first integer in the cell under the `Value` header (column 2 when no
    header names it) of the `activation_budget` row of the Thresholds table in <skill>/references/docs-scaling.md; file, row or integer missing → `no budget set`.
    Else value `<n> of <budget>`, or `over — knowledge-overload phase=<phase> n=<n>` when n exceeds it.

    styles — .dev_flow/output_styles.md absent → `absent`. A profile is a `## Profile: <name>` section, ending at
    the next level-1 or level-2 heading; its register is the first run of letters after `**Applies to:**`,
    lowercased; a profile whose `**Applies to:**` line holds `phases:` or `when:` is narrower, the others are base
    profiles. Value `present · documentation <l> · chat <l>`: per register the first base profile gives the
    language — the first capitalized word (a run of letters whose first letter is upper case), other than the
    line's first word, of its first directive line (`- …`) containing `language` in any case; none → `—`. When a
    narrower profile exists, append ` · narrower <names joined by ", ">` in file order; a narrower profile is named,
    never resolved.

    profile — .dev_flow/profile/ absent → `absent`. Else `<files> · ignored <yes|no|no git> · <entries>`: files =
    the names of user.md and environment.md that exist, joined by ", "; ignored = `check-ignore -q
    .dev_flow/profile/` exit 0 → yes, 1 → no, other → `? <its first non-empty stderr line, else exit <code>>`; no
    git → `no git`. Entries, joined by ", ": per `## <category>` section (ending at the next level-1 or level-2
    heading, as a styles profile does — a `###` heading inside it does not end it; lines before the first section
    are not entries), `<category> consent <value>` for a `> **Consent:** <value> — …` line (the
    value is the text before ` — `), and per bullet "- `<key>` — …" `<category>/<key> <state>`: the bullet split at ` · `, its
    first part holding the key and the value, <state> is the rest of the last later part that starts with
    `state: `, else `—` — a `state:` inside the value or inside another field is no state field. Never a value.

    docs — `_index <yes|no> · _glossary <yes|no> · _framework <yes|no>` for docs/_index.md, docs/_glossary.md,
    docs/_framework.md.

    seeds — <skill>/tools/_index.yaml absent → `—`; not YAML or not a mapping → `? unparsable shipped index`. Per
    entry of `shipped_cards`, in name order: `<name> <router state or absent> seeded v<seeded_from.version or —> /
    shipped v<version>`, the router being .dev_flow/tools/_index.yaml (absent or unparsable = no entries; an
    entry's state as in tools).

    start — `rules <category>: <names joined by ", ">; … · skills <path><file> (<freshness.state>; `no stamp` or
    `missing` as in skills; `—` when the stamp has no state), … · tools
    <name> (<state>), … · stage <g>` from the rules, the selector-matched skills and the tools printed above (their `? …` elements left out), the
    categories in order of their first rule printed, and the task's stage (`—` with no task input, `?` when the
    task fact was not established); an empty part reads `rules —`, `skills —`, `tools —`, a part whose fact was
    not established `rules ?`, `skills ?`, `tools ?`. With the key input, the value starts `phase <phase>:<key> · `.
